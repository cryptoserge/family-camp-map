<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#183f32"><meta name="description" content="お外に行こう。次の休みは、どこで過ごそう。東海と周辺の346施設を地図・区画条件で比較。"><title>お外に行こう。｜家族で探すキャンプ場マップ</title><link rel="icon" href="./tent.svg"><link rel="stylesheet" href="./vendor/leaflet/leaflet.css"><link rel="stylesheet" href="./vendor/cluster/MarkerCluster.css"><link rel="stylesheet" href="./style.css"></head>
<body><div class="app"><header><div class="brand"><div><h1>お外に行こう。</h1><p>次の休みは、どこで過ごそう。</p></div></div><img class="camp-art" src="./camp-illustration.png" alt="" width="216" height="144"><div class="header-actions"><button id="discover" class="discover" disabled aria-describedby="discover-note"><span aria-hidden="true" class="dice">⚄</span><span id="discover-label">今日はここを<br class="desktop-break">見てみる</span></button><button id="compare-open" class="primary">行き先候補 <span id="compare-count">0 / 3</span></button></div><span id="discover-note" class="sr-only" role="status"></span></header>
<section class="filters" aria-label="施設を絞り込む"><div class="search-row"><label class="search"><span class="sr-only">施設名・住所で検索</span><input id="search" type="search" placeholder="施設名・住所で検索"></label><label>地域<select id="region"><option value="">すべて</option></select></label><label>訪問<select id="visit"><option value="">すべて</option><option value="yes">訪問済み</option><option value="no">未訪問</option></select></label><label>サイト<select id="type"><option value="">すべて</option><option>区画</option><option>フリー</option><option>未確認</option></select></label></div><div class="status-row" id="statuses" aria-label="判定"></div></section>
<nav class="mobile-tabs" aria-label="表示切り替え"><button id="view-map" aria-pressed="true">地図</button><button id="view-list" aria-pressed="false">一覧</button></nav>
<main class="workspace" data-view="map"><section class="map-panel" aria-label="キャンプ場の地図"><div id="map"></div><button id="fit-map" class="fit">表示中の施設を見渡す</button><p id="map-error" class="map-error" hidden>地図を読み込めません。一覧と施設リンクをご利用ください。</p><div class="map-key"><span class="dot A"></span>候補 <span class="dot B"></span>条件付き <span class="dot C"></span>情報不足 <span>✓ 訪問済み</span></div></section><section class="list-panel" aria-label="キャンプ場一覧"><div class="list-heading"><div><h2 id="result-count">読み込み中…</h2><p id="location-count"></p></div><button id="reset">条件をリセット</button></div><div id="list"></div></section></main>
<section class="trip-tray" aria-label="次の行き先候補"><img src="./camp-illustration.png" alt="" width="86" height="58"><div class="tray-intro"><h2>次の行き先候補</h2><p id="tray-hint">気になる場所を3つまで。家族で見比べよう。</p></div><div id="tray-camps" class="tray-camps"></div><button id="tray-open" class="primary">家族に相談する <span id="tray-count">0 / 3</span></button></section><footer><span>100㎡以上・フリーサイトも対象。家族5人・ランドロックの一次判定です。</span><span id="updated"></span></footer></div>
<dialog id="detail" aria-labelledby="detail-title"><div class="dialog-top"><span>施設の詳細</span><button data-close="detail" aria-label="詳細を閉じる">×</button></div><div id="detail-body"></div></dialog>
<dialog id="comparison" aria-labelledby="comparison-title"><div class="dialog-top"><h2 id="comparison-title">次の行き先を見比べよう</h2><button data-close="comparison" aria-label="比較を閉じる">×</button></div><div id="comparison-body"></div><div class="share-row"><button id="share" class="primary">この候補を共有</button><span>最大3件・URLで同じ候補を開けます</span></div><label id="copy-fallback" hidden>このURLをコピーしてください<input id="share-url" readonly></label></dialog>
<div id="toast" role="status" aria-live="polite"></div><noscript>このマップにはJavaScriptが必要です。</noscript><script src="./vendor/leaflet/leaflet.js"></script><script src="./vendor/cluster/leaflet.markercluster.js"></script><script type="module" src="./app.js"></script></body></html>
